<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7e9ec"><title>Boo Gift House</title>
<style>
:root{--pink:#f4dfe5;--blue:#e1edf7;--ink:#3d3b40;--muted:#77717a;--line:#eee5e8;--white:#fff;--accent:#b86f83}
*{box-sizing:border-box}body{margin:0;background:#faf8f8;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px 18px;background:linear-gradient(120deg,#f7e7eb,#e8f0f8);position:sticky;top:0;z-index:3}
h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#766e75;font-size:13px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;position:sticky;top:83px;z-index:2;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:0;border-radius:20px;padding:9px 13px;background:#f5f1f2;color:#5e5960;font-weight:600}
nav button.active{background:#b86f83;color:#fff}
main{max-width:900px;margin:auto;padding:16px}
h2{font-size:19px;margin:5px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}
.metric{font-size:22px;font-weight:750;margin-top:6px}.muted{color:var(--muted);font-size:12px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #e4dce0;border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
textarea{min-height:65px}button.primary{border:0;border-radius:11px;padding:12px 15px;background:#b86f83;color:#fff;font-weight:700;margin-top:12px}
button.secondary{border:1px solid #e6dce0;border-radius:10px;padding:9px 12px;background:white;color:var(--ink);margin:4px 4px 4px 0}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.hidden{display:none}.pill{display:inline-block;border-radius:20px;background:#f7edf0;padding:4px 8px;font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:5px}.empty{padding:25px;text-align:center;color:#8a8288}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body>
<header><h1>Boo Gift House</h1><p>Manajemen Baby Hampers · Tanjungpinang</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const KEY='booBabyHampers_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[],"orders":[],"stock":[],"cash":[]}');
let page='Ringkasan';
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav=['Ringkasan','Produk','HPP','Stok','Pesanan','Buku Kas','Backup'];
function go(p){page=p;render()}
function nextCode(cat,gender){let nums=db.products.filter(x=>x.cat===cat&&x.gender===gender).map(x=>+(x.code.match(/\d+$/)||[0])[0]);return String(Math.max(0,...nums)+1).padStart(2,'0')}
function render(){
 document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('');
 const el=document.getElementById('app');
 if(page==='Ringkasan'){
 let revenue=db.orders.reduce((s,o)=>s+o.total,0),cost=db.cash.filter(x=>x.type==='Keluar').reduce((s,x)=>s+x.amount,0);
 el.innerHTML=`<h2>Ringkasan usaha</h2><div class="grid">
 <div class="card"><div class="muted">Total pesanan</div><div class="metric">${db.orders.length}</div></div>
 <div class="card"><div class="muted">Omzet pesanan</div><div class="metric">${money(revenue)}</div></div>
 <div class="card"><div class="muted">Produk terdaftar</div><div class="metric">${db.products.length}</div></div>
 <div class="card"><div class="muted">Catatan kas keluar</div><div class="metric">${money(cost)}</div></div></div>
 <div class="card"><b>Selamat datang!</b><p class="muted">Kelola katalog, HPP, stok, pesanan, dan arus kas Boo Gift House dari satu tempat.</p></div>`;
 }
 if(page==='Produk'){
 el.innerHTML=`<h2>Katalog Produk</h2><div class="card"><h3>Tambah produk</h3>
 <label>Kategori</label><select id="cat"><option>Hampers Box</option><option>Parsel Baby</option></select>
 <label>Jenis</label><select id="gender"><option>Boy</option><option>Girl</option></select>
 <label>Nomor produk otomatis</label><input id="code" value="01" readonly>
 <label>Nama / judul produk</label><input id="name" placeholder="Contoh: Newborn Set">
 <label>Harga jual (Rp)</label><input id="price" type="number" min="0" placeholder="125000">
 <label>Stok produk jadi</label><input id="qty" type="number" min="0" value="0">
 <label>Daftar isi hampers</label><textarea id="contents" placeholder="Tuliskan isi produk, satu item per baris"></textarea>
 <label>Foto produk (opsional)</label><input id="photo" type="file" accept="image/*">
 <button class="primary" onclick="addProduct()">Simpan produk</button></div><div class="card"><h3>Produk tersimpan</h3>${db.products.length?db.products.map(p=>`<div class="item"><b>${esc(p.cat)} ${esc(p.gender)} ${p.code}</b> · ${esc(p.name)}<div class="muted">${money(p.price)} · Stok ${p.qty}</div>${p.contents?`<div class="muted">${esc(p.contents).replace(/\n/g,' · ')}</div>`:''}</div>`).join(''):'<div class="empty">Belum ada produk.</div>'}</div>`;
 document.getElementById('cat').onchange=updateCode;document.getElementById('gender').onchange=updateCode;
 }
 if(page==='HPP'){
 el.innerHTML=`<h2>Kalkulator HPP</h2><div class="card"><label>Pilih produk</label><select id="hp"><option value="">Pilih produk</option>${db.products.map((p,i)=>`<option value="${i}">${esc(p.cat)} ${esc(p.gender)} ${p.code} – ${esc(p.name)}</option>`).join('')}</select>
 <label>Nama bahan / komponen</label><input id="mat" placeholder="Contoh: jumper polos">
 <div class="row"><div><label>Harga satuan (Rp)</label><input id="unit" type="number" value="0"></div><div><label>Jumlah dipakai</label><input id="count" type="number" value="1" step="any"></div></div>
 <button class="secondary" onclick="addCost()">Tambah komponen</button><div id="costlist"></div><div class="item"><b>Total HPP: <span id="totalhpp">Rp0</span></b></div>
 <label>Biaya jasa / operasional tambahan (Rp)</label><input id="extra" type="number" value="0" oninput="calcHpp()">
 <label>Harga jual (Rp)</label><input id="sell" type="number" value="0" oninput="calcHpp()">
 <div class="item">HPP total: <b id="finalhpp">Rp0</b><br>Perkiraan laba: <b id="profit">Rp0</b></div><button class="primary" onclick="saveHpp()">Simpan HPP ke produk</button></div>`;
 }
 if(page==='Stok'){
 el.innerHTML=`<h2>Stok bahan</h2><div class="card"><label>Nama bahan</label><input id="stockname" placeholder="Contoh: tile biru"><div class="row"><div><label>Jumlah masuk</label><input id="stockqty" type="number" value="0"></div><div><label>Satuan</label><input id="stockunit" placeholder="pcs / meter"></div></div><label>Sumber pembelian</label><select id="source"><option>Shopee</option><option>Toko offline</option><option>Lainnya</option></select><label>Total biaya (Rp)</label><input id="stockcost" type="number" value="0"><button class="primary" onclick="addStock()">Catat pembelian stok</button></div><div class="card"><h3>Riwayat stok masuk</h3>${db.stock.length?db.stock.map(s=>`<div class="item"><b>${esc(s.name)}</b><div class="muted">${s.qty} ${esc(s.unit)} · ${esc(s.source)} · ${money(s.cost)}</div></div>`).join(''):'<div class="empty">Belum ada catatan stok.</div>'}</div>`;
 }
 if(page==='Pesanan'){
 el.innerHTML=`<h2>Pesanan pelanggan</h2><div class="card"><label>Nama pemesan</label><input id="buyer"><label>Nomor WhatsApp</label><input id="wa" placeholder="08..."><label>Produk</label><select id="orderprod"><option value="">Pilih produk</option>${db.products.map((p,i)=>`<option value="${i}">${esc(p.cat)} ${esc(p.gender)} ${p.code} – ${esc(p.name)} (${money(p.price)})</option>`).join('')}</select>
 <div class="row"><div><label>Jumlah</label><input id="orderqty" type="number" min="1" value="1"></div><div><label>Ongkir (Rp)</label><input id="shipping" type="number" value="0"></div></div>
 <label>Pengiriman</label><select id="delivery"><option>Kurir</option><option>Ambil sendiri</option></select><label>Pembayaran</label><select id="payment"><option>Cash</option><option>QRIS</option></select><label>Status</label><select id="status"><option>Belum dibayar</option><option>DP</option><option>Lunas</option></select><label>Alamat / catatan</label><textarea id="note"></textarea><button class="primary" onclick="addOrder()">Simpan pesanan</button></div>
 <div class="card"><h3>Daftar pesanan</h3>${db.orders.length?db.orders.map(o=>`<div class="item"><b>${esc(o.buyer)}</b> · ${esc(o.product)}<div class="muted">${o.qty} pcs · ${money(o.total)} · ${esc(o.status)}</div><button class="secondary" onclick="shareOrder(${o.id})">Bagikan WhatsApp</button></div>`).join(''):'<div class="empty">Belum ada pesanan.</div>'}</div>`;
 }
 if(page==='Buku Kas'){
 el.innerHTML=`<h2>Buku Kas</h2><div class="card"><label>Jenis transaksi</label><select id="cashtype"><option>Masuk</option><option>Keluar</option></select><label>Keterangan</label><input id="cashdesc" placeholder="Penjualan / pembelian / operasional"><label>Jumlah (Rp)</label><input id="cashamount" type="number" value="0"><button class="primary" onclick="addCash()">Simpan transaksi</button></div><div class="card"><h3>Riwayat kas</h3>${db.cash.length?db.cash.map(c=>`<div class="item">${esc(c.type)} · ${esc(c.desc)}<b style="float:right">${money(c.amount)}</b></div>`).join(''):'<div class="empty">Belum ada transaksi kas.</div>'}</div>`;
 }
 if(page==='Backup'){
 el.innerHTML=`<h2>Backup & Pemulihan</h2><div class="card"><p class="muted">Data aplikasi tersimpan di browser/perangkat ini. Ekspor backup secara berkala agar data tidak hilang saat browser dibersihkan atau perangkat diganti.</p><button class="primary" onclick="backup()">Unduh backup data</button><label>Import file backup JSON</label><input id="restorefile" type="file" accept=".json,application/json"><button class="secondary" onclick="restore()">Pulihkan data</button></div>`;
 }
}
function updateCode(){let c=document.getElementById('cat').value,g=document.getElementById('gender').value;document.getElementById('code').value=nextCode(c,g)}
function addProduct(){let cat=document.getElementById('cat').value,gender=document.getElementById('gender').value,name=document.getElementById('name').value.trim();if(!name)return alert('Isi nama produk dulu.');let file=document.getElementById('photo').files[0],finish=data=>{db.products.push({cat,gender,code:nextCode(cat,gender),name,price:+price.value||0,qty:+qty.value||0,contents:contents.value,photo:data||'',costs:[],hpp:0});save();render()};if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish('')}
let costs=[];
function addCost(){if(!hp.value)return alert('Pilih produk.');costs.push({name:mat.value||'Komponen',unit:+unit.value||0,count:+count.value||0});document.getElementById('costlist').innerHTML=costs.map(c=>`<div class="muted">${esc(c.name)} · ${money(c.unit)} × ${c.count} = ${money(c.unit*c.count)}</div>`).join('');calcHpp()}
function calcHpp(){let base=costs.reduce((s,c)=>s+c.unit*c.count,0),extra=+document.getElementById('extra').value||0,sell=+document.getElementById('sell').value||0;document.getElementById('totalhpp').textContent=money(base);document.getElementById('finalhpp').textContent=money(base+extra);document.getElementById('profit').textContent=money(sell-base-extra)}
function saveHpp(){if(!hp.value)return alert('Pilih produk.');let p=db.products[+hp.value];p.costs=costs;p.hpp=costs.reduce((s,c)=>s+c.unit*c.count,0)+(+extra.value||0);p.price=+sell.value||p.price;save();alert('HPP tersimpan.');costs=[];render()}
function addStock(){if(!stockname.value.trim())return alert('Isi nama bahan.');db.stock.push({name:stockname.value,qty:+stockqty.value||0,unit:stockunit.value,source:source.value,cost:+stockcost.value||0,date:new Date().toISOString()});save();render()}
function addOrder(){let p=db.products[+orderprod.value];if(!p)return alert('Pilih produk.');let q=+orderqty.value||1,total=p.price*q+(+shipping.value||0);let o={id:Date.now(),buyer:buyer.value,wa:wa.value,product:`${p.cat} ${p.gender} ${p.code} ${p.name}`,qty:q,total,shipping:+shipping.value||0,delivery:delivery.value,payment:payment.value,status:status.value,note:note.value};db.orders.push(o);db.cash.push({type:'Masuk',desc:'Pesanan '+o.buyer,amount:total});save();render()}
function shareOrder(id){let o=db.orders.find(x=>x.id===id),msg=`Halo ${o.buyer}, berikut rincian pesanan Boo Gift House:\n${o.product}\nJumlah: ${o.qty}\nTotal: ${money(o.total)}\nPengiriman: ${o.delivery}\nPembayaran: ${o.payment}\nStatus: ${o.status}`;window.open('https://wa.me/'+o.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function addCash(){db.cash.push({type:cashtype.value,desc:cashdesc.value,amount:+cashamount.value||0});save();render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-boo-gift-house.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){let f=restorefile.files[0];if(!f)return alert('Pilih file backup.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.orders||!d.stock||!d.cash)throw 0;db=d;save();render();alert('Backup berhasil dipulihkan.')}catch(e){alert('File backup tidak valid.')}};r.readAsText(f)}
render();
</script></body></html>
